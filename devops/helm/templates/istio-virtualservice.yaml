{{- if and .Values.ingress.enabled (or .Values.istio.enabled (and .Values.global.istio .Values.global.istio.enabled)) }}
{{- if .Values.istio.gateway.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: VirtualService
metadata:
  name: {{ .Release.Name }}-virtualservice
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "team1-hr-assist.labels" . | nindent 4 }}
spec:
  hosts:
    - {{ .Values.ingress.host | default "*" | quote }}
  gateways:
    - {{ .Release.Name }}-gateway
  http:
    - match:
        - uri:
            prefix: /api
      route:
        - destination:
            host: {{ .Release.Name }}-core-api
            port:
              number: 8000
      {{- if .Values.istio.virtualService.timeout }}
      timeout: {{ .Values.istio.virtualService.timeout }}
      {{- end }}
      {{- if .Values.istio.virtualService.retries }}
      retries:
        {{- toYaml .Values.istio.virtualService.retries | nindent 8 }}
      {{- end }}
    - match:
        - uri:
            prefix: /
      route:
        - destination:
            host: {{ .Release.Name }}-frontend
            port:
              number: 8501
      {{- if .Values.istio.virtualService.timeout }}
      timeout: {{ .Values.istio.virtualService.timeout }}
      {{- end }}
      {{- if .Values.istio.virtualService.retries }}
      retries:
        {{- toYaml .Values.istio.virtualService.retries | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}

