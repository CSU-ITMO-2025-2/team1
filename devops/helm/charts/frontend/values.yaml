image:
  repository: ghcr.io/csu-itmo-2025-2/team1-frontend
  tag: b6453281e7413f3e35e8c7059130b503b763168e
  pullPolicy: Always

replicaCount: 1

resources:
  requests:
    cpu: "100m"
    memory: "256Mi"
  limits:
    cpu: "100m"
    memory: "256Mi"

configMap:
  name: ""

secret:
  name: ""

service:
  port: 8501
  targetPort: 8501

rbac:
  enabled: false

probes:
  liveness:
    httpGet:
      path: /
      port: 8501
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    httpGet:
      path: /
      port: 8501
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Istio Circuit Breaker configuration
istio:
  enabled: false
  circuitBreaker:
    maxConnections: 50
    connectTimeout: "30s"
    maxPendingRequests: 5
    maxRequests: 50
    maxRequestsPerConnection: 2
    maxRetries: 2
    idleTimeout: "90s"
    consecutiveErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 50
    minHealthPercent: 50
    splitExternalLocalOriginErrors: false




