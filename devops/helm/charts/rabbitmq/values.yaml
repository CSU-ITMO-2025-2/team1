image: rabbitmq:3.13-management-alpine
username: guest
vhost: "/"
port: 5672
uiPort: 15672

replicaCount: 1

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

configMap:
  name: ""

secret:
  name: ""

rbac:
  enabled: false

probes:
  liveness:
    exec:
      command:
        - /bin/sh
        - -c
        - "rabbitmq-diagnostics ping || exit 1"
    initialDelaySeconds: 90
    periodSeconds: 30
    timeoutSeconds: 30
    failureThreshold: 3
  readiness:
    exec:
      command:
        - /bin/sh
        - -c
        - "rabbitmq-diagnostics ping || exit 1"
    initialDelaySeconds: 60
    periodSeconds: 10
    timeoutSeconds: 15
    failureThreshold: 3

# Istio Circuit Breaker configuration
istio:
  enabled: false
  circuitBreaker:
    maxConnections: 50
    connectTimeout: "30s"
    maxPendingRequests: 10
    maxRequests: 50
    maxRequestsPerConnection: 2
    maxRetries: 3
    idleTimeout: "90s"
    consecutiveErrors: 5
    interval: "30s"
    baseEjectionTime: "30s"
    maxEjectionPercent: 50
    minHealthPercent: 50
    splitExternalLocalOriginErrors: false


