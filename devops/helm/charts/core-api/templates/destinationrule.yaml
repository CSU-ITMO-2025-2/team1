{{- $dr := .Values.istio.destinationRule }}
{{- if and (or .Values.istio.enabled (and .Values.global.istio .Values.global.istio.enabled)) $dr.enabled }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "core-api.fullname" . }}-destinationrule
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "core-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-circuit-breaker
spec:
  host: {{ include "core-api.fullname" . }}
  trafficPolicy:
    {{- with $dr.trafficPolicy.connectionPool }}
    connectionPool:
      {{- with .http }}
      http:
        {{- if hasKey . "http1MaxPendingRequests" }}
        http1MaxPendingRequests: {{ .http1MaxPendingRequests }}
        {{- end }}
        {{- if hasKey . "maxRequestsPerConnection" }}
        maxRequestsPerConnection: {{ .maxRequestsPerConnection }}
        {{- end }}
      {{- end }}
    {{- end }}
    {{- with $dr.trafficPolicy.outlierDetection }}
    outlierDetection:
      {{- if hasKey . "consecutive5xxErrors" }}
      consecutive5xxErrors: {{ .consecutive5xxErrors }}
      {{- end }}
      {{- if hasKey . "interval" }}
      interval: {{ .interval }}
      {{- end }}
      {{- if hasKey . "baseEjectionTime" }}
      baseEjectionTime: {{ .baseEjectionTime }}
      {{- end }}
      {{- if hasKey . "maxEjectionPercent" }}
      maxEjectionPercent: {{ .maxEjectionPercent }}
      {{- end }}
    {{- end }}
{{- end }}

