image: postgres:16
username: postgres
db: hr_assist
port: 5432

replicaCount: 1

resources:
  requests:
    cpu: "200m"
    memory: "512Mi"
  limits:
    cpu: "200m"
    memory: "512Mi"

secret:
  name: ""

rbac:
  enabled: false

probes:
  liveness:
    exec:
      command:
        - /bin/sh
        - -c
        - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
    initialDelaySeconds: 30
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    exec:
      command:
        - /bin/sh
        - -c
        - "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"
    initialDelaySeconds: 10
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3

# Istio Circuit Breaker configuration
istio:
  enabled: false
  circuitBreaker:
    maxConnections: 20
    connectTimeout: "10s"
    maxPendingRequests: 5
    maxRequests: 20
    maxRequestsPerConnection: 1
    maxRetries: 2
    idleTimeout: "60s"
    consecutiveErrors: 3
    interval: "10s"
    baseEjectionTime: "60s"
    maxEjectionPercent: 30
    minHealthPercent: 70
    splitExternalLocalOriginErrors: false


