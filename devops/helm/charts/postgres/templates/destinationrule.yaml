{{- if or .Values.istio.enabled (and .Values.global.istio .Values.global.istio.enabled) }}
---
apiVersion: networking.istio.io/v1beta1
kind: DestinationRule
metadata:
  name: {{ include "postgres.fullname" . }}-destinationrule
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgres.labels" . | nindent 4 }}
    app.kubernetes.io/component: istio-circuit-breaker
spec:
  host: {{ include "postgres.fullname" . }}
  trafficPolicy:
    connectionPool:
      tcp:
        maxConnections: {{ .Values.istio.circuitBreaker.maxConnections | default 20 }}
        connectTimeout: {{ .Values.istio.circuitBreaker.connectTimeout | default "10s" }}
      http:
        http1MaxPendingRequests: {{ .Values.istio.circuitBreaker.maxPendingRequests | default 5 }}
        http2MaxRequests: {{ .Values.istio.circuitBreaker.maxRequests | default 20 }}
        maxRequestsPerConnection: {{ .Values.istio.circuitBreaker.maxRequestsPerConnection | default 1 }}
        maxRetries: {{ .Values.istio.circuitBreaker.maxRetries | default 2 }}
        idleTimeout: {{ .Values.istio.circuitBreaker.idleTimeout | default "60s" }}
    outlierDetection:
      consecutiveErrors: {{ .Values.istio.circuitBreaker.consecutiveErrors | default 3 }}
      interval: {{ .Values.istio.circuitBreaker.interval | default "10s" }}
      baseEjectionTime: {{ .Values.istio.circuitBreaker.baseEjectionTime | default "60s" }}
      maxEjectionPercent: {{ .Values.istio.circuitBreaker.maxEjectionPercent | default 30 }}
      minHealthPercent: {{ .Values.istio.circuitBreaker.minHealthPercent | default 70 }}
      splitExternalLocalOriginErrors: {{ .Values.istio.circuitBreaker.splitExternalLocalOriginErrors | default false }}
      {{- if .Values.istio.circuitBreaker.detectingConsecutiveGatewayErrors }}
      consecutiveGatewayErrors: {{ .Values.istio.circuitBreaker.detectingConsecutiveGatewayErrors }}
      {{- end }}
      {{- if .Values.istio.circuitBreaker.detectingConsecutive5xxErrors }}
      consecutive5xxErrors: {{ .Values.istio.circuitBreaker.detectingConsecutive5xxErrors }}
      {{- end }}
{{- end }}

